[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "blablalink-union-raid"
version = "0.1.0"
description = "Per-member Union Raid damage from blablalink.com"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = []

[project.scripts]
blablalink-union-raid = "blablalink_union_raid.cli:main"

[tool.setuptools]
packages = ["blablalink_union_raid"]
